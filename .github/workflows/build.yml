name: Build

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0
    - name: Install pnpm
      uses: pnpm/setup@v3
      with:
        cache: true
    - run: pnpm install --frozen-lockfile
    - run: pnpm typecheck
    - run: pnpm lint
    - run: pnpm build
    - uses: actions/upload-pages-artifact@v4
      with:
        path: dist